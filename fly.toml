# fly.toml app configuration file generated for evanoconnor-ie on 2024-03-29T00:19:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "evanoconnor-ie"
primary_region = "cdg"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[http_service.http_options.response]
  pristine = true

[[http_service.checks]]
  grace_period = "10s"
  interval = "1m"
  method = "GET"
  timeout = "5s"
  path = "/"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
