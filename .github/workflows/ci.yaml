name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build
    runs-on: macos-latest
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
    
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run dist

      - name: Cache build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist
